
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Acceso administrativo de Villa Peñas.">
  <title>Acceso administrativo | Villa Peñas</title>

  <link rel="stylesheet" href="login.css">
</head>

<body>

  <main class="login-page">

    <section class="login-card" aria-labelledby="login-title">

      <header class="brand">
        <div class="brand-mark" aria-hidden="true">VP</div>

        <p class="brand-name">Villa Peñas</p>

        <span class="brand-line"></span>

        <p class="brand-tagline">
          MOMENTOS ESPECIALES, RECUERDOS INOLVIDABLES
        </p>
      </header>

      <div class="intro">
        <p class="eyebrow">PANEL ADMINISTRATIVO</p>

        <h1 id="login-title">Bienvenida</h1>

        <p class="intro-copy">
          Ingresá tus credenciales para continuar.
        </p>
      </div>

      <form id="loginForm" class="login-form">

        <div class="form-group">
          <label for="username">Usuario</label>

          <div class="input-wrap">
            <span class="input-symbol" aria-hidden="true">✧</span>

            <input
              id="username"
              name="username"
              type="text"
              placeholder="Ingrese su usuario"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>

          <div class="input-wrap">
            <span class="input-symbol" aria-hidden="true">⌑</span>

            <input
              id="password"
              name="password"
              type="password"
              placeholder="Ingrese su contraseña"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Mostrar contraseña"
            >
              Mostrar
            </button>
          </div>
        </div>

        <button type="submit" class="login-button">
          Iniciar sesión
          <span aria-hidden="true">→</span>
        </button>

        <p
          id="loginMessage"
          class="login-message"
          role="alert"
          aria-live="polite"
        ></p>

      </form>

      <footer class="card-footer">
        <span class="footer-rule"></span>

        <p>Acceso exclusivo para administración</p>
      </footer>

    </section>

    <a class="back-link" href="index.html">
      ← Volver al sitio web
    </a>

  </main>

  <script src="JS/login.js"></script>

</body>
</html>
